<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Nova RP Loading Screen</title>
    <!-- Подключаем ваш любимый шрифт Nunito -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0b0f;
            font-family: 'Nunito', sans-serif;
            color: #ffffff;
        }
        /* Анимированный глубокий фиолетовый фон */
        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #2e1065 0%, #0b0b0f 70%);
            opacity: 0.6;
            animation: pulseBg 8s ease-in-out infinite alternate;
            z-index: 1;
        }
        @keyframes pulseBg {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.1); opacity: 0.8; }
        }
        /* Главный контейнер */
        .container {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            z-index: 2;
            text-align: center;
        }
        /* Название сервера */
        .server-name {
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 30px rgba(138, 43, 226, 0.6);
            animation: fadeInDown 1.5s ease-out;
        }
        .server-sub {
            font-size: 20px;
            font-weight: 700;
            color: #a78bfa;
            margin-bottom: 60px;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: fadeIn 2s ease-out;
        }
        /* Блок прогресса загрузки */
        .loading-box {
            width: 450px;
            background: rgba(20, 20, 25, 0.8);
            border: 1px solid rgba(138, 43, 226, 0.2);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeInUp 1.5s ease-out;
        }
        .status-text {
            font-size: 16px;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
        }
        /* Полоса прогресса */
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #8b5cf6, #d946ef);
            box-shadow: 0 0 15px #8b5cf6;
            border-radius: 4px;
            transition: width 0.3s ease-out;
        }
        .files-needed {
            font-size: 13px;
            color: #64748b;
            margin-top: 12px;
            font-weight: 700;
        }
        /* Анимации */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }
    </style>
</head>
<body>

        <script>
        var audio = null;
        var musicStarted = false;

        // Инициализация загрузки файла через Blob
        function initAudio() {
            var request = new XMLHttpRequest();
            request.open('GET', 'loading.ogg', true);
            request.responseType = 'blob'; // Безопасный тип данных для GMod

            request.onload = function() {
                if (request.status === 200) {
                    // Создаем временную внутреннюю ссылку на файл в памяти
                    var blob = request.response;
                    var audioUrl = URL.createObjectURL(blob);
                    
                    // Создаем стандартный элемент аудио
                    audio = new Audio();
                    audio.src = audioUrl;
                    audio.volume = 0.3; // Громкость 30%
                    audio.loop = true;  // Зацикливание
                    
                    // Пробуем запустить
                    tryPlayMusic();
                }
            };
            request.send();
        }

        // Функция принудительного воспроизведения
        function tryPlayMusic() {
            if (audio && !musicStarted) {
                audio.play().then(function() {
                    musicStarted = true;
                }).catch(function(e) {
                    // Игнорируем ошибку автоплея, движок GMod подтолкнет ее позже
                    console.log("Ожидание триггера загрузки...");
                });
            }
        }

        // Интеграция с движком Garry's Mod и пинки для аудио-движка
        function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
            tryPlayMusic();
        }

        function DownloadingFile(fileName) {
            document.getElementById("status").innerHTML = "Скачивание: " + fileName;
            tryPlayMusic();
        }

        function SetStatusChanged(status) {
            document.getElementById("status").innerHTML = status;
            tryPlayMusic();
        }

        function SetFilesNeeded(needed) {
            tryPlayMusic();
            if (!window.totalFiles) { window.totalFiles = needed; }
            var remaining = Math.max(0, needed);
            document.getElementById("files").innerHTML = "Осталось файлов: " + remaining;
            
            var progress = 0;
            if (window.totalFiles > 0) {
                progress = ((window.totalFiles - remaining) / window.totalFiles) * 100;
            }
            document.getElementById("progress").style.width = progress + "%";
        }

        // Запуск скачивания при старте страницы
        window.addEventListener("DOMContentLoaded", initAudio);
    </script>

</body>
</html>
