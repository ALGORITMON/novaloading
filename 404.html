<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена | NOVA RP</title>
    <style>
        body {
            background-color: #141518;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        .error-code {
            font-size: 120px;
            font-weight: bold;
            color: #ff4d4d;
            line-height: 1;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 15px;
        }
        p {
            color: #8a8d93;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: #242529;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            border: 1px solid #34373c;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .btn:hover {
            background-color: #2e3035;
            border-color: #ff4d4d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1>Файл или страница не найдены</h1>
        <p>Возможно, документ еще не опубликован, был перемещен или удален администрацией проекта NOVA RP.</p>
        <a href="https://algoritmon.github.io/novarp" class="btn">Вернуться на главную</a>
    </div>
</body>
</html>
